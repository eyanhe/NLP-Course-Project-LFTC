[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lftc"
version = "0.1.0"
description = "Text classification experiments and research tools"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]

[project.scripts]
lftc = "lftc.cli:main"

[project.optional-dependencies]
ml = [
  "numpy==1.26.4", "pandas==2.2.1", "pyarrow==24.0.0",
  "scikit-learn==1.6.1", "scipy==1.12.0", "joblib==1.2.0",
  "threadpoolctl==3.6.0", "matplotlib==3.8.3", "gensim==4.3.0",
]
train = [
  "lftc[ml]", "torch>=2.2.1", "transformers==4.57.6", "datasets==5.0.0",
  "huggingface-hub==0.36.2", "safetensors==0.8.0",
  "datasketch==1.6.5", "psutil==6.1.1",
]
ui = ["streamlit==1.40.1", "pandas==2.2.1", "numpy==1.26.4", "altair>=5.0", "matplotlib==3.8.3"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
